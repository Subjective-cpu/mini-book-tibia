<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Mini Book de Casas - Tibia</title>

<style>
body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #222;
    padding: 20px;
}

h1 {
    text-align: center;
}

.form-container, .card {
    background: #ffffff;
    padding: 15px;
    margin-bottom: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

input, select, textarea {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
    background: #fff;
    color: #222;
}

button {
    padding: 8px;
    background: #4CAF50;
    border: none;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

.gallery {
    margin-top: 10px;
}

.img-wrapper {
    display: inline-block;
    position: relative;
}

.gallery img {
    width: 100px;
    margin: 5px;
    border-radius: 5px;
    cursor: pointer;
    border: 1px solid #ddd;
}

.remove-btn {
    position: absolute;
    top: 2px;
    right: 2px;
    background: red;
    border: none;
    color: white;
    font-size: 12px;
    cursor: pointer;
    border-radius: 3px;
}

#lightbox {
    display: none;
    position: fixed;
    z-index: 999;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
}

#lightbox img {
    display: block;
    margin: 5% auto;
    max-width: 80%;
    max-height: 80%;
}

#houses {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.card {
    width: 100%;
}

.url-item {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 5px;
}

/* 🎞️ GIF FIXO */
#fixedGif {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 1000;
}

#fixedGif img {
    width: 180px;
}
</style>
</head>

<body>

<!-- 🎞️ GIF FIXO -->
<div id="fixedGif">
    <img src="https://www.tibiawiki.com.br/images/4/49/Outfit_Jester_Male_Addon_3.gif">
</div>

<h1>📘 Mini Book de Casas</h1>

<!-- 🔍 LUPA (ADICIONADA) -->
<div style="text-align:center; margin-bottom:20px;">
    <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 Buscar casa, dono ou guild..." 
        onkeyup="filterHouses()"
        style="width:300px;"
    >
</div>

<!-- 🏴 BANNER -->
<div style="text-align:center; margin-bottom:20px;">
    <div style="position:relative; display:inline-block;">
        <img src="https://www.tibiahof.com/img/archives/fronts/main_02.png" style="max-width:100%; border-radius:10px;">
        
        <div style="
            position:absolute;
            bottom:10px;
            left:50%;
            transform:translateX(-50%);
            text-align:center;
        ">
            <div style="
                background:rgba(0,0,0,0.9);
                color:#FFD700;
                padding:12px 25px;
                border-radius:12px;
                font-size:28px;
                font-weight:bold;
                text-shadow: 0 0 15px #FFD700, 0 0 5px #fff;
            ">
                Subjectivefive
            </div>

            <div style="
                margin-top:5px;
                background:rgba(0,0,0,0.7);
                color:#ffffff;
                padding:5px 10px;
                border-radius:8px;
                font-size:14px;
            ">
                Paulistinha OT - Dominium
            </div>
        </div>
    </div>
</div>

<div class="form-container">
    <h2>➕ Adicionar Casa</h2>

    <input type="text" id="owner" placeholder="Nome do dono">
    <input type="text" id="guild" placeholder="Guild do dono">
    <input type="text" id="classe" placeholder="Classe do personagem">
    
    <input type="text" id="houseName" placeholder="Nome da casa">
    <input type="text" id="location" placeholder="Localização da casa">

    <select id="type">
        <option>Casa de Entrada</option>
        <option>Casa de Ruptura</option>
        <option>Casa de Redirecionamento</option>
        <option>Casa Fantasma</option>
        <option>Casa Loop</option>
    </select>

    <textarea id="objective" placeholder="Objetivo da casa"></textarea>

    <input type="text" id="urlInput" placeholder="Adicionar URL">
    <button type="button" onclick="addURL()">➕ Adicionar URL</button>
    <div id="urlList"></div>

    <input type="file" id="images" multiple accept="image/*">

    <button onclick="addHouse()">Salvar Casa</button>
</div>

<div id="houses"></div>

<div id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img">
</div>

<script>

/* 🔍 FUNÇÃO DA LUPA (ADICIONADA) */
function filterHouses() {
    const input = document.getElementById('searchInput').value.toLowerCase();
    const houses = document.querySelectorAll('#houses .card');

    houses.forEach(house => {
        const text = house.innerText.toLowerCase();

        if (text.includes(input)) {
            house.style.display = '';
        } else {
            house.style.display = 'none';
        }
    });
}

/* CÓDIGO ORIGINAL INTACTO */

function addHouse() {
    const owner = document.getElementById('owner').value;
    const guild = document.getElementById('guild').value;
    const classe = document.getElementById('classe').value;
    const houseName = document.getElementById('houseName').value;
    const location = document.getElementById('location').value;
    const type = document.getElementById('type').value;
    const objective = document.getElementById('objective').value;
    const images = document.getElementById('images').files;

    const houseDiv = document.createElement('div');
    houseDiv.classList.add('card');

    houseDiv.innerHTML = `
        <h2>${houseName}</h2>
        <p><strong>Dono:</strong> ${owner}</p>
        <p><strong>Guild:</strong> ${guild}</p>
        <p><strong>Classe:</strong> ${classe}</p>
        <p><strong>Localização:</strong> ${location}</p>
        <p><strong>Tipo:</strong> ${type}</p>
        <p><strong>Objetivo:</strong> ${objective}</p>

        <div class="gallery"></div>

        <input type="file" accept="image/*" onchange="addImage(this)">

        <div class="url-container"></div>

        <button onclick="removeHouse(this)" style="background:red;margin-top:10px;">
            ❌ Excluir Casa
        </button>
    `;

    const gallery = houseDiv.querySelector('.gallery');

    for (let i = 0; i < images.length && i < 5; i++) {
        createImage(gallery, images[i]);
    }

    const urls = document.querySelectorAll('#urlList .url-item');
    const urlContainer = houseDiv.querySelector('.url-container');

    urls.forEach(item => {
        const url = item.getAttribute('data-url');

        const wrapper = document.createElement('div');
        wrapper.classList.add('url-item');

        const openBtn = document.createElement('button');
        openBtn.innerText = "🌐 Abrir URL";
        openBtn.onclick = () => openCustomURL(url);

        const removeBtn = document.createElement('button');
        removeBtn.innerText = "X";
        removeBtn.style.background = "red";
        removeBtn.onclick = () => wrapper.remove();

        wrapper.appendChild(openBtn);
        wrapper.appendChild(removeBtn);

        urlContainer.appendChild(wrapper);
    });

    document.getElementById('urlList').innerHTML = "";

    document.getElementById('houses').appendChild(houseDiv);

    document.querySelectorAll('.form-container input, .form-container textarea').forEach(el => el.value = '');
}

function addURL() {
    const input = document.getElementById('urlInput');
    let url = input.value.trim();

    if (!url) return;

    if (!url.startsWith('http')) {
        url = 'https://' + url;
    }

    const div = document.createElement('div');
    div.classList.add('url-item');
    div.setAttribute('data-url', url);

    const span = document.createElement('span');
    span.innerText = url;

    const remove = document.createElement('button');
    remove.innerText = "X";
    remove.style.background = "red";
    remove.onclick = () => div.remove();

    div.appendChild(span);
    div.appendChild(remove);

    document.getElementById('urlList').appendChild(div);

    input.value = "";
}

function addImage(input) {
    const gallery = input.previousElementSibling;

    if (gallery.children.length >= 5) {
        alert("Limite de 5 imagens atingido!");
        return;
    }

    const file = input.files[0];
    if (!file) return;

    createImage(gallery, file);
    input.value = "";
}

function createImage(gallery, file) {
    const reader = new FileReader();

    reader.onload = function(e) {
        const wrapper = document.createElement('div');
        wrapper.classList.add('img-wrapper');

        const img = document.createElement('img');
        img.src = e.target.result;

        img.onclick = () => openLightbox(e.target.result);

        const remove = document.createElement('button');
        remove.innerText = "X";
        remove.classList.add('remove-btn');
        remove.onclick = () => wrapper.remove();

        wrapper.appendChild(img);
        wrapper.appendChild(remove);
        gallery.appendChild(wrapper);
    };

    reader.readAsDataURL(file);
}

function removeHouse(button) {
    const house = button.closest('.card');
    house.remove();
}

function openLightbox(src) {
    document.getElementById('lightbox-img').src = src;
    document.getElementById('lightbox').style.display = 'block';
}

function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
}

function openCustomURL(url) {
    window.open(url, '_blank');
}

function saveHouses() {
    localStorage.setItem('housesData', document.getElementById('houses').innerHTML);
}

function loadHouses() {
    const data = localStorage.getItem('housesData');
    if (data) {
        document.getElementById('houses').innerHTML = data;
    }
}

const observer = new MutationObserver(saveHouses);

observer.observe(document.getElementById('houses'), {
    childList: true,
    subtree: true
});

window.onload = function() {
    loadHouses();
};
</script>

</body>
</html>
